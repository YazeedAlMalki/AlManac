# Builds and tests AlmanacCore on Linux.
#
# This exists because the sessions that write this package cannot always run
# Swift: the toolchain lives outside the connected folder on `yamal`, and the
# cloud containers have no toolchain at all and cannot fetch one
# (download.swift.org is refused by their network policy). Everything under
# docs/implementation-status.md §4d-§4g was therefore verified against SQLite
# and by reading, never compiled. This is the check that closes that gap, and
# it runs on every push rather than when someone remembers.
#
# Pinned to a Swift image rather than `latest`, so a toolchain release cannot
# turn a green branch red on its own. `yamal` runs 6.3.3; a difference between
# the two is a real finding either way, and the version is stated so it is
# obvious which one reported what.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: swift build && swift test
    runs-on: ubuntu-latest
    container: swift:6.0.3-jammy
    steps:
      - uses: actions/checkout@v5

      # The vendored SQLite amalgamation is ~8 MB of C and dominates a cold
      # build; .build is safe to cache because Package.swift pins no remote
      # dependencies at all.
      - name: Cache build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swift-6.0.3-${{ hashFiles('Package.swift', 'Sources/CSQLite/sqlite3.c') }}
          restore-keys: ${{ runner.os }}-swift-6.0.3-

      - name: Version
        run: swift --version

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build

  # The Swift job above is the fast gate and stays on Linux, which is cheaper
  # and has no Xcode. It only ever saw Sources/ — every file under Native/ was
  # built by hand, on whichever machine happened to open the project, or not at
  # all. That gap let four hand-found `fix(ui)` bugs in, and it left ~1,500
  # lines of new view code from 2026-09-26 with no automated check of any kind.
  #
  # The two jobs below close it, split by cost. `build-app` compiles the app and
  # the widget extension and is the cheap, low-flake gate on every push. Only
  # `test-ios` needs a simulator, so only it is allowed to be slow.
  build-app:
    name: xcodebuild (app + widget)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      # GitHub ships one major Xcode per macOS image and rotates the patch
      # release underneath it, so `macos-26` is the pin that actually holds: a
      # major bump is a real change and fails loudly, while a patch rotation
      # does not block every push.
      #
      # The selected app is resolved rather than hard-coded to
      # `/Applications/Xcode_26.app`. That path is a guess: image manifests have
      # used both `Xcode_26.app` and a fully versioned `Xcode_26.3.app`, and
      # `xcode-select -s` on a path that does not exist fails the whole job with
      # a message that says nothing about the cause. So: prefer the newest Xcode
      # 26, fall back to whatever the image defaults to, and print what is
      # actually installed either way so a mismatch is legible rather than
      # mysterious.
      #
      # This job builds a `generic/platform=iOS Simulator` destination, so it
      # needs an SDK rather than a runtime and it was unaffected by the
      # runtime/Xcode mismatch that broke `test-ios`. It still gets the ordering
      # fix, because "the oldest Xcode happens to have the SDK" is luck, and the
      # image is free to drop that SDK on a rotation.
      - name: Select an Xcode 26
        run: |
          set -uo pipefail
          echo "installed:"
          ls -1 /Applications | grep -i '^Xcode' || echo "  (none found)"
          # Newest, not first. `macos-26` carries seven Xcodes (26.0.1 .. 26.6) and
          # a shell glob expands in lexicographic order, so taking the first match
          # selected the OLDEST one, 26.0.1. That is what broke `test-ios`: an old
          # Xcode drives none of the simulator runtimes the image has, so
          # `xcodebuild test` found zero eligible destinations and died in 13s
          # with exit 70, while `simctl` returned a well-formed UDID belonging to
          # a runtime a different Xcode owned. `isAvailable` does not mean
          # "drivable by the selected toolchain" -- the `test-ios` job's "Pick a
          # simulator" step is what enforces that, and it needs this fix in order
          # to have a toolchain to measure against.
          #
          # `|| true` because a `run:` step executes under `bash -e`: a glob that
          # matches nothing fails the pipeline, and the assignment's exit status
          # would abort the step before the fallback below could report anything.
          SELECTED=$(ls -1d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$SELECTED" ]; then
            sudo xcode-select -s "$SELECTED"
            echo "selected $SELECTED"
          else
            echo "::warning::no Xcode 26 found; falling back to the image default"
          fi
          xcodebuild -version

      # `generic/platform=iOS Simulator` rather than a named device: it needs no
      # simulator to exist, and there is no device name in this file to go stale.
      # CODE_SIGNING_ALLOWED=NO because a CI runner has no signing identity, and
      # no target here needs one.
      #
      # SWIFT_EMIT_LOC_STRINGS=YES makes the compiler write a .stringsdata file
      # per Swift file listing every localizable literal under the exact key
      # SwiftUI will look up. The next step reads them.
      - name: Build
        run: |
          set -euo pipefail
          xcodebuild build \
            -project Native/Almanac.xcodeproj \
            -scheme Almanac \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_EMIT_LOC_STRINGS=YES

      # Every string the compiler extracted from the app and the widget must
      # have Arabic in its String Catalog (#4), with the same format specifiers
      # as its key. Strict: a new English-only string fails here, naming the
      # file and line, instead of shipping in English to an Arabic phone.
      - name: Untranslated strings
        run: python3 tools/localization/check_catalog.py "$HOME/Library/Developer/Xcode/DerivedData" --strict

      # The widget is not in the scheme's build action; xcodebuild inserts the
      # dependency implicitly because Almanac.app has an "Embed App Extensions"
      # phase. Asserting the artefact rather than trusting that: a scheme edit
      # that drops the phase would otherwise leave the widget silently unbuilt,
      # which is exactly the class of thing this job exists to catch.
      - name: Assert the widget was embedded
        run: |
          set -euo pipefail
          APPEX=$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -name Almanac.app -path '*Debug-iphonesimulator*' -print -quit)
          test -n "$APPEX"
          test -d "$APPEX/PlugIns/AlmanacWidgets.appex" || {
            echo "AlmanacWidgets.appex is missing from $APPEX/PlugIns — the widget was not built or not embedded"
            exit 1
          }
          echo "widget present: $APPEX/PlugIns/AlmanacWidgets.appex"

  test-ios:
    name: AlmanacUITests
    runs-on: macos-26
    needs: build-app
    steps:
      - uses: actions/checkout@v5

      - name: Select an Xcode 26
        run: |
          set -uo pipefail
          # Newest, not first. `macos-26` carries seven Xcodes (26.0.1 .. 26.6) and
          # a shell glob expands in lexicographic order, so taking the first match
          # selected the OLDEST one, 26.0.1. That Xcode drives none of the simulator
          # runtimes the image actually has, so `xcodebuild test` found zero
          # eligible destinations and died in 13s with exit 70 -- while `simctl`
          # returned a well-formed UDID belonging to a runtime a different Xcode
          # owned. `isAvailable` does not mean "drivable by the selected
          # toolchain"; the "Pick a simulator" step below is what enforces that.
          #
          # `|| true` because a `run:` step executes under `bash -e`: a glob that
          # matches nothing fails the pipeline, and the assignment's exit status
          # would abort the step before the fallback below could report anything.
          SELECTED=$(ls -1d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$SELECTED" ]; then
            sudo xcode-select -s "$SELECTED"
            echo "selected $SELECTED"
          else
            echo "::warning::no Xcode 26 found; falling back to the image default"
          fi
          xcodebuild -version

      # The simulator is discovered rather than named. A hard-coded
      # `-destination name=iPhone 16e` silently stops matching the moment GitHub
      # rotates the device set, and a destination that matches nothing does not
      # fail — the job queues and reports nothing. This prefers the newest
      # available iOS runtime and says which it picked, so a surprising result is
      # legible in the log.
      #
      # "Newest" is bounded by the *selected toolchain*, which is the part that
      # was missing and the reason this job had never passed. `simctl` enumerates
      # every runtime in the shared CoreSimulator directory, including ones owned
      # by other Xcodes, and reports them all as `isAvailable`. It will therefore
      # happily hand back a UDID that the selected `xcodebuild` cannot drive, and
      # the result is a destination error that names neither the Xcode nor the
      # runtimes. So the SDK the chosen Xcode reports is the ceiling: a newer
      # Xcode drives older runtimes, never the reverse.
      #
      # Two details of `simctl list -j` that are easy to get wrong, and were:
      # the top-level keys are full runtime *identifiers*
      # (`com.apple.CoreSimulator.SimRuntime.iOS-26-3`), not display names, so a
      # `startswith("iOS")` filter silently matches nothing; and the values are
      # lists of devices, so a `.get("isAvailable")` on the value raises.
      - name: Pick a simulator
        id: sim
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          echo "selected toolchain can drive iOS simulators up to $SDK"
          UDID=$(xcrun simctl list devices available -j | SIM_SDK_VERSION="$SDK" python3 -c '
          import json, os, re, sys

          def rank(runtime_id):
              # "com.apple.CoreSimulator.SimRuntime.iOS-26-3" -> (26, 3)
              tail = runtime_id.rsplit(".", 1)[-1]
              return tuple(int(n) for n in re.findall(r"\d+", tail)) or (0,)

          sdk_raw = os.environ.get("SIM_SDK_VERSION", "")
          sdk = tuple(int(n) for n in re.findall(r"\d+", sdk_raw))
          if not sdk:
              sys.exit("SIM_SDK_VERSION unset; cannot tell which runtimes this Xcode drives")

          seen, usable = [], []
          for runtime_id, devices in json.load(sys.stdin).get("devices", {}).items():
              if ".iOS" not in runtime_id:
                  continue
              r = rank(runtime_id)
              for d in devices:
                  if d.get("isAvailable") and d.get("name", "").startswith("iPhone"):
                      seen.append((r, d["name"]))
                      if r <= sdk:
                          usable.append((r, d["name"], d["udid"]))

          if not usable:
              print("no installed iOS runtime this toolchain can drive "
                    "(simulator SDK %s)" % sdk_raw, file=sys.stderr)
              for r, n in sorted(set(seen)):
                  print("  available: iOS %s  %s" % (".".join(map(str, r)), n), file=sys.stderr)
              sys.exit(1)

          # Newest usable runtime first. The device name is a deterministic
          # tiebreak, not a preference: alphabetical order picks "iPhone Air"
          # over "iPhone 17 Pro Max", so CI may run on a different device than
          # local. That is acceptable -- it is discovered, never hard-coded --
          # but it does mean a geometry-sensitive test can pass here and fail on
          # a desk, or the reverse.
          usable.sort(key=lambda c: (c[0], c[1]))
          chosen = usable[-1]
          if chosen[0] != sdk:
              print("::warning::no iOS %s runtime installed; falling back to iOS %s"
                    % (sdk_raw, ".".join(map(str, chosen[0]))), file=sys.stderr)
          print("using %s on iOS %s" % (chosen[1], ".".join(map(str, chosen[0]))), file=sys.stderr)
          print(chosen[2])
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # This runs against a *virgin* simulator, which is the stricter of the two
      # states and not the same thing as "the only state that matters". Both
      # were found the hard way here, and each hid a bug the other did not:
      #
      # - On a populated database, `testSettingsCanToggleTheDigestionActivityRing`
      #   passed while on an empty one it failed, because the Form is lazily
      #   built and the row sat two screens further down with nothing above it.
      # - On an *empty* database it then passed while on a second, populated
      #   run it failed, because the drink logger deliberately stays open when
      #   the service returns warnings, and the test had assumed it dismissed
      #   itself.
      #
      # CI only ever sees the first state, so it cannot catch the second class
      # on its own. That is worth remembering before deleting a local re-run.
      #
      # `-resultBundlePath` is set explicitly so a failure can be attached to
      # the run. Without it the bundle lands in DerivedData under a name that
      # includes a UUID, which is not something a workflow can name.
      - name: Test
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Native/Almanac.xcodeproj \
            -scheme Almanac \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/AlmanacUITests.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/xcodebuild-test.log"

      # Every assertion failure, gathered at the end of the log. The UI suite
      # writes tens of thousands of lines, and a failure's message is otherwise
      # only findable by scrolling the whole run; log readers that fetch only
      # the tail (as the cloud sessions' tools do) never see it at all.
      - name: Summarise failures
        if: failure()
        run: |
          grep -E ": error: |Test Case .* failed" "$RUNNER_TEMP/xcodebuild-test.log" | cut -c1-600 || true

      - name: Attach the result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AlmanacUITests.xcresult
          path: ${{ runner.temp }}/AlmanacUITests.xcresult
          if-no-files-found: ignore
          retention-days: 7
